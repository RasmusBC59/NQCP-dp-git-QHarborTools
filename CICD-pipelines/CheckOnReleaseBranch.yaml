parameters:
  tagName: ''

steps:
- script: |
    echo "Checking if tag ${{ parameters.tagName }} is on a release branch..."
    TAG_COMMIT=$(git rev-list -n 1 ${{ parameters.tagName }})
    echo "Tag commit: $TAG_COMMIT"
    if [ -z "$TAG_COMMIT" ]; then
      echo "❌ Tag ${{ parameters.tagName }} does not exist on the latest commits inside the release branch..
      Please, ensure, that the tag is created."
      exit 1
    fi
    BRANCHES=$(git branch -r --contains $TAG_COMMIT | grep 'release/v')
    if [ -z "$BRANCHES" ]; then
      echo "❌ Tag is not on a release branch. Failing the pipeline."
      exit 1
    else
      echo "✅ Tag is on a release branch."
    fi
  displayName: 'Check if tag is on release branch.'