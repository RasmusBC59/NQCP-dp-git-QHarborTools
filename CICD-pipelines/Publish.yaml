steps:
  - script: |
      git clone --branch main https://$(TARGET_REPO_TOKEN)@dev.azure.com/NQCP/NQCP/_git/NQCP-dp-git-webappdocs

      cd NQCP-dp-git-webappdocs

      rm -rf webappdocs/_build/html/data/qhabortools

      mkdir -p webappdocs/_build/html/data/qhabortools

      cp -r $BUILD_SOURCESDIRECTORY/docs/_build/html/* webappdocs/_build/html/data/qhabortools

      cd webappdocs
      git config user.email "ci-bot@example.com"
      git config user.name  "ci-bot"
      git add .
      git commit -m "Update documentation" || echo "No changes to commit"
      git push origin main
    displayName: 'Push Documentation to main branch'
    env:
      TARGET_REPO_TOKEN: $(TARGET_REPO_TOKEN)
  - task: TwineAuthenticate@1
    inputs:
      artifactFeed: "NQCP/NQCP_Tier2"
  - task: CmdLine@2
    inputs:
      script: |
        python -m twine upload -r NQCP_Tier2 --config-file $(PYPIRC_PATH) dist/*.whl
    displayName: "Upload package to NQCP PyPI feed"